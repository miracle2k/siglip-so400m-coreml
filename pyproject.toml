[project]
name = "siglip-so400m-coreml"
version = "0.1.0"
description = "Reproducible Core ML conversion and palettization of the SigLIP SO400M 384px vision tower"
requires-python = ">=3.11,<3.12"
dependencies = [
    "coremltools==9.0",
    "numpy==1.26.4",
    "pillow==11.1.0",
    "safetensors==0.5.3",
    "scikit-learn==1.5.1",
    "sentencepiece==0.2.0",
    "torch==2.7.0",
    "transformers==4.48.1",
]

[tool.uv]
package = false
